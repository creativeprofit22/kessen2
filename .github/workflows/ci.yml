name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No build manifest exists yet (no CMakeLists.txt / package.json), so there
      # is nothing to install, build or test. This guard keeps copyrighted disc
      # content out of the public repo until real build steps are added.
      - name: Guard against committed game data
        run: |
          bad=$(git ls-files | grep -Ei '\.(iso|bin|cue|img|mdf|mds|nrg|chd|elf|irx)$|(^|/)(SLPM|SLUS|SLES)_' || true)
          if [ -n "$bad" ]; then
            echo "::error::Game/disc files must not be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No game data tracked."
