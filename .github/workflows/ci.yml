name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Keeps copyrighted disc content out of the public repo.
      - name: Guard against committed game data
        run: |
          bad=$(git ls-files | grep -Ei '\.(iso|bin|cue|img|mdf|mds|nrg|chd|elf|irx)$|(^|/)(SLPM|SLUS|SLES)_' || true)
          if [ -n "$bad" ]; then
            echo "::error::Game/disc files must not be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No game data tracked."

      # Compiler-free check that cmake/K2Modules.cmake rejects forbidden module edges.
      - name: Module dependency rule (negative test)
        run: >
          cmake -DFIXTURE_DIR=tests/cmake/dep_violation
          -DWORK_DIR=${{ runner.temp }}/k2dv
          -P tests/cmake/run_dep_violation.cmake

      # Fails fast when a patch listed in patches/ps2recomp/series no longer applies
      # to the pinned submodule (configure would fail the same way, much later).
      # Patches stack, so apply them in order to an export, as configure does.
      - name: PS2Recomp patches apply
        run: |
          export_dir="${{ runner.temp }}/ps2recomp-patched"
          mkdir -p "$export_dir"
          git -c core.autocrlf=false -C external/PS2Recomp archive --format=tar HEAD | tar -x -C "$export_dir"
          while read -r line || [ -n "$line" ]; do
            p=$(printf '%s' "${line%%#*}" | tr -d '[:space:]')
            [ -z "$p" ] && continue
            echo "applying $p"
            GIT_CEILING_DIRECTORIES="$export_dir" git -C "$export_dir" apply "$GITHUB_WORKSPACE/patches/ps2recomp/$p"
          done < patches/ps2recomp/series

  build-windows:
    # windows-latest ships VS 2026 since June 2026; the msvc-x64 preset targets VS 2022.
    runs-on: windows-2022
    # First build fetches SDL3, raylib, imgui and a FFmpeg prebuilt.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset msvc-x64

      - name: Build
        run: cmake --build --preset msvc-x64-debug --parallel

      # bash so the k2_guard test resolves Git for Windows' sh.
      - name: Test
        shell: bash
        run: ctest --preset msvc-x64

      - name: Smoke run
        shell: bash
        run: out/build/msvc-x64/app/Debug/kessen2.exe --version
